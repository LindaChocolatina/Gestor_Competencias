<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jardín de Competencias SENA 🌱</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <header class="glass-header">
        <div class="header-content">
            <div class="header-top">
                <div>
                    <h1>Juicios de Evaluación Botánicos 🌿</h1>
                    <p>Ficha: 3336242 - ANÁLISIS Y DESARROLLO DE SOFTWARE</p>
                </div>
                <div class="global-progress-badge">
                    <span id="global-progress-text">0% GLOBAL</span>
                </div>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">Por Competencia (<span id="count-all">0</span>)</button>
                <button class="filter-btn" data-filter="pending">Por Aprobar (<span id="count-pending">0</span>)</button>
                <button class="filter-btn" data-filter="approved">Aprobados (<span id="count-approved">0</span>)</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="raps-container" class="competencias-list">
            <!-- Competencias and RAPs will be dynamically inserted here -->
        </div>
    </main>

    <!-- Load the data generated by the script -->
    <script src="datos.js"></script>
    <script src="app.js"></script>
</body>
</html>
