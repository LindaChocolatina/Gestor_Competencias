        <div class="cover-content">
            <p class="cover-script">Jardín de</p>
            <h1>Competencias</h1>
            <p class="cover-kicker">Semilla, Plántula, Flor</p>
            <p class="cover-meta">Ficha 3336242 · Análisis y Desarrollo de Software</p>
            <a class="scroll-cue" href="#jardin">
                Entrar al jardín
                <span class="scroll-arrow" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M6 9l6 6 6-6"/>
                    </svg>
                </span>
            </a>
        </div>

        <div class="cover-mob-flora" aria-hidden="true">
            <svg class="mob-daisy" viewBox="0 0 80 80">
                <g transform="translate(40,40)">
                    <ellipse cx="0" cy="-22" rx="4" ry="20" fill="#E3B84A"/>

    <div class="workspace" id="jardin">
        <div class="workspace-flora" aria-hidden="true">
            <svg class="mini-daisy" viewBox="0 0 80 80">
                <g transform="translate(40,40)">
                    <ellipse cx="0" cy="-22" rx="4" ry="20" fill="#E3B84A"/>
                    <ellipse cx="0" cy="-22" rx="4" ry="20" fill="#E8C04A" transform="rotate(45)"/>
                    <ellipse cx="0" cy="-22" rx="4" ry="20" fill="#D4A63A" transform="rotate(90)"/>
                    <ellipse cx="0" cy="-22" rx="4" ry="20" fill="#E3B84A" transform="rotate(135)"/>
                    <ellipse cx="0" cy="-22" rx="4" ry="20" fill="#F0C85A" transform="rotate(180)"/>
                    <ellipse cx="0" cy="-22" rx="4" ry="20" fill="#E3B84A" transform="rotate(225)"/>
                    <ellipse cx="0" cy="-22" rx="4" ry="20" fill="#D4A63A" transform="rotate(270)"/>
                    <ellipse cx="0" cy="-22" rx="4" ry="20" fill="#E8C04A" transform="rotate(315)"/>
                    <circle r="8" fill="#C4922E"/>
                </g>
            </svg>
            <svg class="mini-lupine" viewBox="0 0 40 120">
                <path d="M20 118 V8" fill="none" stroke="#5C7A40" stroke-width="2"/>
                <ellipse cx="20" cy="12" rx="4" ry="6" fill="#E8D8F0"/>
                <ellipse cx="20" cy="26" rx="6" ry="8" fill="#D2C0DC"/>
                <ellipse cx="14" cy="42" rx="7" ry="9" fill="#C9B0D8"/>
                <ellipse cx="26" cy="58" rx="7" ry="9" fill="#C45C74" opacity=".8"/>
                <ellipse cx="14" cy="76" rx="8" ry="10" fill="#B89BC8"/>
                <ellipse cx="26" cy="94" rx="7" ry="9" fill="#D2C0DC"/>
            </svg>
        </div>

        <section class="palette" aria-label="Resumen del jardín">
            <figure class="swatch">
                <div class="swatch-circle berry" id="stat-pending">0</div>
                <figcaption>Por florecer</figcaption>
            </figure>
            <figure class="swatch">
                <div class="swatch-circle lilac" id="stat-total">0</div>
                <figcaption>RAPs</figcaption>
            </figure>
            <figure class="swatch">
                <div class="swatch-circle sage" id="stat-comps">0</div>
                <figcaption>Competencias</figcaption>
            </figure>
            <figure class="swatch">
                <div class="swatch-circle mustard" id="stat-percent">0%</div>
                <figcaption>En flor</figcaption>
            </figure>
        </section>

        <header class="toolbar">
            <div class="vine" aria-hidden="true"><div class="vine-fill" id="vine-fill"></div></div>
            <div class="toolbar-inner">
                <label class="search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <circle cx="11" cy="11" r="6.5"/>
                        <path d="M16 16l5 5"/>
                    </svg>
                    <input id="search" type="search" placeholder="Buscar competencia o RAP…" autocomplete="off">
                </label>

                <div class="filters" role="tablist" aria-label="Filtrar el jardín">
                    <button class="filter-btn active" data-filter="all" type="button">
                        El jardín <span id="count-all">0</span>
                    </button>
                    <button class="filter-btn" data-filter="pending" type="button">
                        Por florecer <span id="count-pending">0</span>
                    </button>
                    <button class="filter-btn" data-filter="approved" type="button">
                        En flor <span id="count-approved">0</span>
                    </button>
                </div>
            </div>
        </header>

        <div class="legend" aria-label="Estados de crecimiento">
            <span class="legend-item s-1"><i></i> Suelo esperando semilla</span>
            <span class="legend-item s-2"><i></i> Semilla</span>
            <span class="legend-item s-4"><i></i> Brote</span>
            <span class="legend-item s-3"><i></i> Plántula</span>
            <span class="legend-item s-5"><i></i> Flor</span>
            <span class="legend-item s-6"><i></i> Planta marchita</span>
        </div>
        <div class="flora-key" id="flora-key" aria-label="Flores por asignatura"></div>

        <main class="container">
            <div id="raps-container" class="competencias-list"></div>
        </main>
    </div>

    <script src="datos.js"></script>
    <script src="garden.js"></script>
    <script src="app.js"></script>
</body>
</html>
